name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject GUI Assets
        run: |
          wget -q https://www.renpy.org/dl/8.2.3/renpy-8.2.3-sdk.tar.bz2
          tar xf renpy-8.2.3-sdk.tar.bz2
          cp -r renpy-8.2.3-sdk/the_question/game/gui ./game/
          cp renpy-8.2.3-sdk/the_question/game/gui.rpy ./game/ || true

      - name: Build Android
        uses: ProjectAliceDev/renpy-build-action@master
        with:
          sdk-version: "8.2.3"
          project-dir: "."
          package: "android"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "**/*.apk"
