name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Download RenPy
        run: |
          wget -q https://www.renpy.org/dl/8.2.3/renpy-8.2.3-sdk.tar.bz2
          tar xf renpy-8.2.3-sdk.tar.bz2
          wget -q https://www.renpy.org/dl/8.2.3/renpy-8.2.3-rapt.zip
          unzip -q renpy-8.2.3-rapt.zip -d renpy-8.2.3-sdk/

      - name: Inject GUI Assets
        run: |
          cp -r renpy-8.2.3-sdk/the_question/game/gui ./game/
          cp renpy-8.2.3-sdk/the_question/game/gui.rpy ./game/ || true

      - name: Create Android Config
        run: |
          echo "{\"package\":\"com.example.mygame\",\"name\":\"My Game\",\"version\":\"1.0\"}" > .android.json

      - name: Build APK
        run: |
          chmod +x renpy-8.2.3-sdk/renpy.sh
          renpy-8.2.3-sdk/renpy.sh . android_build

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "**/*.apk"
